<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEAT AI - 모바일 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #050608; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .mobile-container {
      width: 402px; height: 850px; background: #0D0E12; border-radius: 32px;
      border: 4px solid #1E2029; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .status-bar { width: 100%; padding: 12px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
    .time { color: #ffffff; font-size: 14px; font-weight: 600; }
    
    .app-header {
      padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05); background: #0D0E12;
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 10px; height: 10px; background: #E2FF00; border-radius: 50%; }
    .logo-text { color: #ffffff; font-size: 18px; font-weight: 800; }
    .badge-premium {
      padding: 4px 8px; background: rgba(255, 94, 58, 0.13); border-radius: 100px;
      border: 1px solid #FF5E3A; color: #FF5E3A; font-size: 10px; font-weight: 700;
    }
    
    .chat-body { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; scroll-behavior: smooth; }
    .chat-title-bar { display: flex; align-items: center; gap: 10px; color: #ffffff; font-weight: 700; }
    .bot-icon { width: 32px; height: 32px; background: #E2FF00; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #0D0E12; font-weight: bold; }
    
    .msg-user {
      align-self: flex-end; max-width: 280px; padding: 12px 14px; background: rgba(255, 94, 58, 0.10);
      border-radius: 18px; border: 1px solid rgba(255, 94, 58, 0.20); color: #ffffff; font-size: 14px; line-height: 20px; word-break: break-word;
    }
    
    .msg-ai {
      align-self: flex-start; width: 320px; padding: 14px; background: rgba(255, 255, 255, 0.05);
      border-radius: 18px; border: 1px solid #E2FF00; box-shadow: 0px 0px 16px rgba(226, 255, 0, 0.15);
      display: flex; flex-direction: column; gap: 10px; color: #ffffff; font-size: 14px; line-height: 20px;
    }
    .ai-badge { display: flex; align-items: center; gap: 8px; color: #E2FF00; font-size: 12px; font-weight: 700; }
    .platform-badge { font-size: 10px; padding: 2px 6px; background: rgba(255, 0, 0, 0.15); border: 1px solid #FF0000; border-radius: 4px; color: #FF4D4D; margin-left: auto; }

    .song-card {
      padding: 10px; background: rgba(255, 255, 255, 0.03); border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 10px;
    }
    .song-info { display: flex; align-items: center; gap: 10px; }
    .song-thumb { width: 44px; height: 44px; border-radius: 10px; background: #220000; border: 1px solid #FF0000; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #FF0000; }
    .actions-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    
    .btn-act {
      padding: 6px 10px; background: rgba(226, 255, 0, 0.08); border-radius: 10px;
      border: 1px solid #E2FF00; color: #E2FF00; font-size: 11px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s;
    }
    .btn-act:hover { background: rgba(226, 255, 0, 0.2); }
    .btn-act.youtube { background: #FF0000; color: #ffffff; border: none; }
    .btn-act.youtube:hover { background: #cc0000; }

    .chat-footer { padding: 12px 20px 20px; display: flex; gap: 12px; align-items: center; background: #0D0E12; }
    .input-box {
      flex: 1; padding: 12px 14px; background: rgba(255, 255, 255, 0.04); border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; font-size: 14px; outline: none;
    }
    .input-box:focus { border-color: #E2FF00; }
    .btn-send {
      width: 44px; height: 44px; background: #E2FF00; border-radius: 22px; border: none;
      box-shadow: 0px 4px 12px rgba(226, 255, 0, 0.30); cursor: pointer; font-weight: bold; font-size: 16px; color: #0D0E12;
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="status-bar"><div class="time">9:41</div></div>
    
    <div class="app-header">
      <div class="logo"><div class="logo-dot"></div><div class="logo-text">BEAT <span style="color:#E2FF00">AI</span></div></div>
      <div class="badge-premium">PREMIUM</div>
    </div>

    <div class="chat-body" id="chatContainer">
      <div class="chat-title-bar"><div class="bot-icon">🤖</div>AI 음악 탐색 챗봇</div>
      
      <div class="msg-user">Supernova</div>
      
      <div class="msg-ai">
        <div class="ai-badge">
          <span>⚡ 정밀 AI 매칭</span>
          <span class="platform-badge">▶ YouTube 연동</span>
        </div>
        <div>곡명 <strong>'Supernova'</strong>를 정확하게 검색했습니다! aespa의 대표 댄스 트랙입니다.</div>
        <div class="song-card">
          <div class="song-info">
            <div class="song-thumb">▶</div>
            <div>
              <div style="font-size:13px; font-weight:700;">Supernova</div>
              <div style="font-size:12px; color:#9CA3AF;">aespa · 댄스</div>
            </div>
          </div>
          <div class="actions-grid">
            <button class="btn-act youtube" onclick="openYouTube('aespa', 'Supernova')">▶ YouTube에서 감상</button>
            <button class="btn-act" onclick="addRating('Supernova')">⭐ 별점</button>
            <button class="btn-act" onclick="addToUserList('Supernova')">📥 내 목록</button>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="chatInput" class="input-box" placeholder="노래 제목이나 아티스트를 입력하세요..." onkeypress="if(event.key==='Enter') sendChatMessage()" />
      <button class="btn-send" onclick="sendChatMessage()">➔</button>
    </div>
  </div>

  <script>
    const defaultDatabase = [
      { id: 1, title: 'Supernova', artist: 'aespa', genre: '댄스', tags: ['#신나는', '#트렌디'], match: 100, active: true },
      { id: 2, title: 'Hype Boy', artist: 'NewJeans', genre: 'K-Pop', tags: ['#청량한', '#인기차트'], match: 100, active: true },
      { id: 3, title: 'Love wins all', artist: '아이유 (IU)', genre: 'K-Pop', tags: ['#감성적인', '#보컬'], match: 100, active: true },
      { id: 4, title: 'To. X', artist: '태연 (TAEYEON)', genre: '발라드', tags: ['#발라드', '#이별'], match: 100, active: true },
      { id: 5, title: 'D (Half Moon)', artist: 'DEAN (딘)', genre: 'R&B', tags: ['#R&B', '#몽환적인'], match: 100, active: true },
      { id: 6, title: 'Spot!', artist: '지코 (feat. JENNIE)', genre: 'K-Pop', tags: ['#신나는', '#힙합'], match: 100, active: true },
      { id: 7, title: '모든 날, 모든 순간', artist: '폴킴', genre: '발라드', tags: ['#발라드', '#힐링'], match: 100, active: true }
    ];

    function getDB() {
      try {
        const stored = localStorage.getItem('beat_ai_tracks');
        if (stored) return JSON.parse(stored);
        localStorage.setItem('beat_ai_tracks', JSON.stringify(defaultDatabase));
      } catch (e) {
        console.warn('Memory Mode Enabled:', e);
      }
      return defaultDatabase;
    }

    function sanitize(str) {
      return (str || '').toString().toLowerCase().replace(/\s+/g, '');
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function openYouTube(artist, title) {
      const q = encodeURIComponent(`${artist} ${title} official`);
      window.open(`https://www.youtube.com/results?search_query=${q}`, '_blank');
    }

    function searchTracks(rawQuery, db) {
      const q = sanitize(rawQuery);
      const activeTracks = db.filter(t => t.active !== false);

      if (!q) return null;

      // 1순위: 곡명 정확 일치 또는 포함
      let matches = activeTracks.filter(t => sanitize(t.title).includes(q) || q.includes(sanitize(t.title)));
      if (matches.length > 0) return { type: 'exact_title', songs: matches };

      // 2순위: 아티스트 일치
      matches = activeTracks.filter(t => sanitize(t.artist).includes(q) || q.includes(sanitize(t.artist)));
      if (matches.length > 0) return { type: 'artist', songs: matches };

      // 3순위: 장르 일치
      matches = activeTracks.filter(t => sanitize(t.genre) === q);
      if (matches.length > 0) return { type: 'genre', songs: matches };

      // 4순위: 태그 매칭
      matches = activeTracks.filter(t => t.tags && t.tags.some(tag => sanitize(tag).includes(q)));
      if (matches.length > 0) return { type: 'tag', songs: matches };

      return null;
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const query = input.value.trim();
      if (!query) return;

      const container = document.getElementById('chatContainer');
      
      const userMsg = document.createElement('div');
      userMsg.className = 'msg-user';
      userMsg.innerText = query;
      container.appendChild(userMsg);
      input.value = '';
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        const db = getDB();
        const result = searchTracks(query, db);
        const aiMsg = document.createElement('div');
        aiMsg.className = 'msg-ai';

        if (result && result.songs.length > 0) {
          const song = result.songs[0];
          let desc = `'${escapeHtml(query)}' 키워드로 검색된 <strong>${escapeHtml(song.genre)}</strong> 트랙 <strong>${escapeHtml(song.artist)} - ${escapeHtml(song.title)}</strong>입니다.`;
          
          if (result.type === 'exact_title') {
            desc = `곡 제목 <strong>'${escapeHtml(song.title)}'</strong>을(를) 정확하게 매칭했습니다!`;
          }

          aiMsg.innerHTML = `
            <div class="ai-badge">
              <span>⚡ 정밀 AI 매칭 완료</span>
              <span class="platform-badge">▶ YouTube 연동</span>
            </div>
            <div>${desc}</div>
            <div class="song-card">
              <div class="song-info">
                <div class="song-thumb">▶</div>
                <div>
                  <div style="font-size:13px; font-weight:700;">${escapeHtml(song.title)}</div>
                  <div style="font-size:12px; color:#9CA3AF;">${escapeHtml(song.artist)} · ${escapeHtml(song.genre)}</div>
                </div>
              </div>
              <div class="actions-grid">
                <button class="btn-act youtube" onclick="openYouTube('${escapeHtml(song.artist)}', '${escapeHtml(song.title)}')">▶ YouTube에서 감상</button>
                <button class="btn-act" onclick="addRating('${escapeHtml(song.title)}')">⭐ 별점</button>
                <button class="btn-act" onclick="addToUserList('${escapeHtml(song.title)}')">📥 저장</button>
              </div>
            </div>
          `;
        } else {
          aiMsg.innerHTML = `
            <div class="ai-badge">
              <span>🔍 외부 탐색</span>
              <span class="platform-badge">▶ YouTube 검색</span>
            </div>
            <div>등록된 데이터 중 일치하는 곡이 없습니다. 유튜브에서 <strong>'${escapeHtml(query)}'</strong>을(를) 직접 검색하시겠습니까?</div>
            <button class="btn-act youtube" style="width:100%; justify-content:center; padding:8px; margin-top:4px;" onclick="openYouTube('', '${escapeHtml(query)}')">
              ▶ YouTube에서 '${escapeHtml(query)}' 즉시 검색
            </button>
          `;
        }

        container.appendChild(aiMsg);
        container.scrollTop = container.scrollHeight;
      }, 400);
    }

    function addRating(title) { alert(`⭐ '${title}' 별점이 추가되었습니다.`); }
    function addToUserList(title) { alert(`📥 '${title}' 플레이리스트에 저장되었습니다.`); }
  </script>
</body>
</html>
